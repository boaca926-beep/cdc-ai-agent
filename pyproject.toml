[project]
name = "ai-agent-context-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "deltalake==0.20.0",
    "pandas==2.2.3",
    "pyarrow==18.0.0",
    "python-slugify>=9.1.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]

pipeline = [
    "delta-spark==4.0.0",
    "duckdb>=1.5.5",
    "psycopg2-binary>=2.9.13",
    "pyspark==4.0.0",
]

# Tell uv to install the pipeline group by default
# refresh the lock "uv lock", since we edited pyproject.toml by hand
# pyproject.toml  →  uv lock  →  uv.lock  →  uv sync  →  .venv
#   (intent)         (resolve)  (plan)      (install)   (reality)

[tool.uv]
default-groups = ["pipeline"]