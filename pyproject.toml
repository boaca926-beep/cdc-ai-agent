[project]
name = "ai-agent-context-pipeline"
version = "0.1.0"
description = "Postgres CDC to local LLM context pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Data pipeline ---
    "pyspark==4.0.0",
    "delta-spark==4.0.0",
    "psycopg2-binary>=2.9.13",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "duckdb>=1.5.5",

    # --- Generative AI ---
    "openai>=1.30.0",

    # --- Serving / API ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "deltalake==0.20.0",
    "pyarrow==18.0.0",

    # --- Config ---
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[tool.uv]
package = false